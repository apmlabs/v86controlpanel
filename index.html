<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>v86 Control Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        #header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        #header h1 { font-size: 18px; color: #0ff; }
        #controls { display: flex; gap: 8px; }
        #controls button {
            padding: 6px 16px; border: 1px solid #0ff; background: transparent;
            color: #0ff; cursor: pointer; font-size: 13px; border-radius: 3px;
        }
        #controls button:hover { background: #0ff2; }
        #controls button:disabled { opacity: 0.3; cursor: default; }
        #status { margin-left: auto; font-size: 13px; color: #888; }
        #main { display: flex; height: calc(100vh - 48px); }
        #sidebar {
            width: 200px; background: #16213e; padding: 12px;
            display: flex; flex-direction: column; gap: 8px; border-right: 1px solid #333;
            flex-shrink: 0;
        }
        .profile-btn {
            padding: 10px; background: #1a1a2e; border: 1px solid #333;
            color: #e0e0e0; cursor: pointer; border-radius: 4px; text-align: left; font-size: 13px;
        }
        .profile-btn:hover { border-color: #0ff; }
        .profile-btn.active { border-color: #0ff; background: #0a3d62; }
        .profile-btn .label { font-weight: bold; }
        .profile-btn .desc { font-size: 11px; color: #888; margin-top: 2px; }
        #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        #screen-area { flex: 1; display: flex; align-items: center; justify-content: center; }
        #screen_container { background: #000; border: 2px solid #333; overflow: hidden; }
        #screen_container div { white-space: pre; font: 14px monospace; line-height: 14px; }
        #screen_container canvas { display: none; }
        #terminal-wrap { display: none; flex: 1; background: #000; border: 2px solid #333; margin: 8px; overflow: hidden; width: calc(100% - 16px); }
        #terminal-wrap .xterm { height: 100%; width: 100% !important; }
        #terminal-wrap .xterm-screen { width: 100% !important; }
        #terminal-wrap .xterm-viewport { width: 100% !important; overflow-y: auto !important; scrollbar-width: none; }
        #terminal-wrap .xterm-viewport::-webkit-scrollbar { display: none; }
        #log-area {
            height: 100px; background: #0d0d1a; border-top: 1px solid #333;
            overflow-y: auto; padding: 8px 12px; font: 12px monospace; color: #666;
            flex-shrink: 0;
        }
        #log-area .err { color: #f44; }
        #log-area .ok { color: #3fb950; }
        #log-area .info { color: #58a6ff; }
    </style>
</head>
<body>
    <div id="header">
        <h1>⚡ v86 Control Panel</h1>
        <div id="controls">
            <button id="btn-start" onclick="startVM()">▶ Start</button>
            <button id="btn-stop" onclick="stopVM()" disabled>⏹ Stop</button>
            <button id="btn-restart" onclick="restartVM()" disabled>🔄 Restart</button>
            <button id="btn-save" onclick="saveState()" disabled>💾 Save</button>
            <button id="btn-restore" onclick="restoreState()" disabled>📂 Restore</button>
            <button id="btn-fullscreen" onclick="goFullscreen()" disabled>⛶ Fullscreen</button>
        </div>
        <div id="status">Stopped</div>
    </div>
    <div id="main">
        <div id="sidebar">
            <div class="profile-btn active" onclick="selectProfile('alpine')" id="prof-alpine">
                <div class="label">🐧 Alpine 3.23</div>
                <div class="desc">Linux terminal</div>
            </div>
            <div class="profile-btn" onclick="selectProfile('tinycore')" id="prof-tinycore">
                <div class="label">🐧 TinyCore 17</div>
                <div class="desc">Lightweight GUI Linux</div>
            </div>
            <div class="profile-btn" onclick="selectProfile('kolibri')" id="prof-kolibri">
                <div class="label">💎 KolibriOS</div>
                <div class="desc">ASM OS, instant boot</div>
            </div>
            <div class="profile-btn" onclick="selectProfile('jsdos')" id="prof-jsdos">
                <div class="label">🎮 js-dos</div>
                <div class="desc">DOS games (C&C, Doom…)</div>
            </div>
            <div class="profile-btn" onclick="selectProfile('9front')" id="prof-9front">
                <div class="label">🔷 9front</div>
                <div class="desc">Plan 9 fork</div>
            </div>
            <div class="profile-btn" onclick="selectProfile('chromium')" id="prof-chromium">
                <div class="label">🌐 Chromium</div>
                <div class="desc">Real browser (noVNC)</div>
            </div>
        </div>
        <div id="content">
            <div id="screen-area">
                <div id="screen_container">
                    <div></div>
                    <canvas></canvas>
                </div>
            </div>
            <div id="terminal-wrap"></div>
            <div id="vnc-wrap" style="display:none; flex:1; margin:4px;">
                <iframe id="vnc-iframe" style="width:100%; height:100%; border:2px solid #333;"></iframe>
            </div>
            <div id="jsdos-wrap" style="display:none; flex:1; margin:4px; flex-direction:column;">
                <div id="jsdos-picker" style="padding:20px; text-align:center;">
                    <h3 style="color:#0ff; margin-bottom:12px;">🎮 Pick a DOS game</h3>
                    <select id="jsdos-game" style="padding:8px; font-size:14px; background:#1a1a2e; color:#e0e0e0; border:1px solid #0ff; border-radius:4px; margin-bottom:12px;">
                        <option value="jsdos/doom.jsdos">Doom</option>
                        <option value="jsdos/doom2.jsdos">Doom II</option>
                        <option value="jsdos/cnc.jsdos">Command & Conquer</option>
                        <option value="jsdos/prince.jsdos">Prince of Persia</option>
                        <option value="jsdos/warcraft.jsdos">WarCraft</option>
                        <option value="jsdos/lemmings.jsdos">Lemmings</option>
                        <option value="jsdos/heretic.jsdos">Heretic</option>
                        <option value="jsdos/gta.jsdos">GTA</option>
                        <option value="jsdos/nfs.jsdos">Need for Speed</option>
                        <option value="jsdos/digger.jsdos">Digger</option>
                    </select>
                    <br>
                    <button onclick="launchJsDos()" style="padding:8px 24px; background:#0ff; color:#000; border:none; border-radius:4px; cursor:pointer; font-size:14px;">▶ Launch</button>
                    <p style="color:#666; margin-top:12px; font-size:12px;">Games powered by <a href="https://js-dos.com" target="_blank" style="color:#58a6ff;">js-dos</a></p>
                </div>
                <div id="jsdos-container" style="flex:1; width:100%;"></div>
            </div>
            <div id="log-area"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <script src="node_modules/v86/build/libv86.js"></script>
    <script>
    let emulator = null;
    let currentProfile = "alpine";

    const profiles = {
        alpine: {
            bzimage: { url: "images/alpine-bzimage" },
            initrd: { url: "images/alpine-initrd" },
            cdrom: { url: "images/alpine.iso" },
            cmdline: "console=ttyS0 modules=loop,squashfs,sd-mod,usb-storage quiet",
            memory_size: 128 * 1024 * 1024,
            net_device: { type: "virtio", relay_url: "fetch" },
            useTerminal: true,
        },
        tinycore: {
            cdrom: { url: "images/tinycore.iso" },
            memory_size: 256 * 1024 * 1024,
            net_device: { type: "virtio", relay_url: "fetch" },
        },
        kolibri: {
            fda: { url: "images/kolibri.img", size: 1474560 },
        },
        jsdos: { jsdos: true },
        "9front": {
            hda: { url: "images/9front.iso", size: 481742848, async: true },
            memory_size: 256 * 1024 * 1024,
            acpi: true,
        },
        chromium: { noVNC: true },
    };

    // --- Server-side state API ---
    async function stateSave(profile, data) {
        const resp = await fetch("api/states/" + profile, { method: "PUT", body: data });
        return resp.json();
    }
    async function stateLoad(profile) {
        const resp = await fetch("api/states/" + profile);
        if (!resp.ok) return null;
        return resp.arrayBuffer();
    }
    async function stateList() {
        const resp = await fetch("api/states");
        return resp.json();
    }

    function log(msg, cls) {
        const el = document.getElementById("log-area");
        const line = document.createElement("div");
        line.className = cls || "";
        line.textContent = new Date().toLocaleTimeString() + " " + msg;
        el.appendChild(line);
        el.scrollTop = el.scrollHeight;
    }

    function setStatus(text) { document.getElementById("status").textContent = text; }

    function setButtons(running) {
        document.getElementById("btn-start").disabled = running;
        document.getElementById("btn-stop").disabled = !running;
        document.getElementById("btn-restart").disabled = !running;
        document.getElementById("btn-save").disabled = !running;
        document.getElementById("btn-fullscreen").disabled = !running;
    }

    function clearScreen() {
        const c = document.getElementById("screen_container");
        const canvas = c.querySelector("canvas");
        canvas.style.display = "none";
        const ctx = canvas.getContext("2d");
        if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        c.querySelector("div").textContent = "";
    }

    function showTerminal(show) {
        document.getElementById("terminal-wrap").style.display = show ? "flex" : "none";
        document.getElementById("screen-area").style.display = show ? "none" : "flex";
        document.getElementById("vnc-wrap").style.display = "none";
        document.getElementById("jsdos-wrap").style.display = "none";
    }

    function showVNC(show) {
        document.getElementById("vnc-wrap").style.display = show ? "flex" : "none";
        document.getElementById("screen-area").style.display = show ? "none" : "flex";
        document.getElementById("terminal-wrap").style.display = "none";
        document.getElementById("jsdos-wrap").style.display = "none";
    }

    function showJsDos(show) {
        document.getElementById("jsdos-wrap").style.display = show ? "flex" : "none";
        document.getElementById("screen-area").style.display = show ? "none" : "flex";
        document.getElementById("terminal-wrap").style.display = "none";
        document.getElementById("vnc-wrap").style.display = "none";
        if (show) {
            document.getElementById("jsdos-picker").style.display = "block";
            document.getElementById("jsdos-container").innerHTML = "";
        }
    }

    function selectProfile(name) {
        if (name === currentProfile) return;
        if (emulator || profiles[currentProfile]?.noVNC || profiles[currentProfile]?.jsdos) stopVM();
        currentProfile = name;
        document.querySelectorAll(".profile-btn").forEach(b => b.classList.remove("active"));
        document.getElementById("prof-" + name).classList.add("active");
        log("Selected " + name, "info");
        checkSavedState();
    }

    async function checkSavedState() {
        const states = await stateList().catch(() => ({}));
        document.getElementById("btn-restore").disabled = !states[currentProfile];
    }

    let jsdosInstance = null;

    function launchJsDos() {
        const url = document.getElementById("jsdos-game").value;
        document.getElementById("jsdos-picker").style.display = "none";
        const container = document.getElementById("jsdos-container");
        container.innerHTML = "";
        log("Launching DOS game...", "info");
        setStatus("js-dos — Loading...");
        Dos(container, { url: url });
        jsdosInstance = container;
        log("DOS game launched", "ok");
        setStatus("js-dos — Running");
    }

    function startVM() {
        const profile = profiles[currentProfile];

        // js-dos
        if (profile.jsdos) {
            showJsDos(true);
            setButtons(true);
            log("js-dos ready — pick a game", "info");
            setStatus("js-dos — Pick a game");
            return;
        }

        // Chromium via noVNC
        if (profile.noVNC) {
            if (document.getElementById("vnc-iframe").src.includes("vnc_lite")) return;
            showVNC(true);
            document.getElementById("vnc-iframe").src = "../novnc/vnc_lite.html?autoconnect=true&resize=scale&path=novnc/websockify";
            log("Connecting to Chromium via noVNC...", "info");
            setStatus("Chromium — Connected");
            setButtons(true);
            return;
        }

        if (emulator) return;
        clearScreen();
        const useTerminal = profile.useTerminal;
        showTerminal(useTerminal);
        log("Starting " + currentProfile + "...", "info");

        const opts = {
            wasm_path: "node_modules/v86/build/v86.wasm",
            bios: { url: "bios/seabios.bin" },
            vga_bios: { url: "bios/vgabios.bin" },
            memory_size: profile.memory_size || 64 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,
            autostart: true,
            fastboot: true,
        };

        if (useTerminal) {
            // xterm.js serial terminal — v86 handles the wiring
            opts.serial_container_xtermjs = document.getElementById("terminal-wrap");
        } else {
            opts.screen_container = document.getElementById("screen_container");
        }

        for (const k of ["fda","hda","hdb","cdrom","bzimage","initrd","cmdline","net_device","acpi"]) {
            if (profile[k] !== undefined) opts[k] = profile[k];
        }

        try {
            emulator = new V86(opts);
        } catch (e) {
            log("Failed: " + e.message, "err");
            return;
        }

        setStatus("Booting " + currentProfile + "...");
        setButtons(true);

        emulator.add_listener("emulator-ready", () => {
            log(currentProfile + " ready", "ok");
            setStatus(currentProfile + " — Running");
            // For graphical profiles, click screen to lock mouse
            if (!useTerminal) {
                const screen = document.getElementById("screen_container");
                screen.title = "Click to capture mouse (Esc to release)";
                screen.style.cursor = "pointer";
                screen.onclick = () => { emulator.lock_mouse(); };
            }
        });
        emulator.add_listener("download-error", (e) => log("Download error: " + JSON.stringify(e), "err"));
        emulator.add_listener("download-progress", (e) => {
            if (e.loaded && e.total) setStatus("Downloading... " + ((e.loaded / e.total) * 100 | 0) + "%");
        });
    }

    function stopVM() {
        // js-dos
        if (profiles[currentProfile]?.jsdos) {
            document.getElementById("jsdos-container").innerHTML = "";
            jsdosInstance = null;
            showJsDos(false);
            setStatus("Stopped");
            setButtons(false);
            log("js-dos stopped", "info");
            return;
        }
        // noVNC
        if (profiles[currentProfile]?.noVNC) {
            document.getElementById("vnc-iframe").src = "";
            showVNC(false);
            setStatus("Stopped");
            setButtons(false);
            log("Disconnected from Chromium", "info");
            return;
        }
        if (!emulator) return;
        log("Stopping VM...");
        emulator.destroy();
        emulator = null;
        clearScreen();
        showTerminal(false);
        setStatus("Stopped");
        setButtons(false);
    }

    function restartVM() {
        if (!emulator) return;
        log("Restarting...", "info");
        emulator.restart();
    }

    async function saveState() {
        if (!emulator) return;
        log("Saving state...", "info");
        setStatus("Saving...");
        try {
            const state = await emulator.save_state();
            const result = await stateSave(currentProfile, state);
            log("State saved to server: " + result.raw_mb + " MB → " + result.compressed_mb + " MB compressed", "ok");
            setStatus("Saved (" + result.compressed_mb + " MB)");
            document.getElementById("btn-restore").disabled = false;
        } catch (e) {
            log("Save failed: " + e.message, "err");
            setStatus("Save failed");
        }
    }

    async function restoreState() {
        try {
            log("Loading state from server...", "info");
            setStatus("Loading...");
            const state = await stateLoad(currentProfile);
            if (!state) { log("No saved state for " + currentProfile, "err"); setStatus("No state"); return; }
            if (!emulator) startVM();
            await new Promise(r => setTimeout(r, 200));
            log("Restoring state...", "info");
            await emulator.restore_state(state);
            log("State restored (" + (state.byteLength / 1024 / 1024).toFixed(1) + " MB)", "ok");
            setStatus(currentProfile + " — Restored");
        } catch (e) {
            log("Restore failed: " + e.message, "err");
        }
    }

    function goFullscreen() {
        if (!emulator) return;
        emulator.screen_go_fullscreen();
    }

    log("v86 Control Panel loaded", "ok");
    checkSavedState();
    </script>
</body>
</html>
